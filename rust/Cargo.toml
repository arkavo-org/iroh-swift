[package]
name = "iroh-swift-ffi"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Minimal FFI bindings for Iroh blob operations"

[lib]
crate-type = ["staticlib"]
name = "iroh_swift"

[dependencies]
# Same wire lines as the backend: https://github.com/arkavo-org/tdf-iroh-s3 (iroh 1.x, iroh-blobs 0.104).
# iroh-blobs 0.104.1 removes the `.obao4` file of an inlined outboard once an import
# completes (n0-computer/iroh-blobs#334); 0.104.0 leaked it.
iroh = "1.4.1"
iroh-blobs = { version = "0.104.1", features = ["fs-store"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
tokio-util = "0.7"
anyhow = "1"
tracing = "0.1"
futures-lite = "2"
hex = "0.4"
rand = "0.10"
# BLAKE3 for `iroh_blake3_hex` (same crate iroh-blobs hashes with).
blake3 = "1.8"
# Pkarr address lookup on the BitTorrent Mainline DHT (opt-in via `dht_lookup`).
iroh-mainline-address-lookup = "0.6"
# The DHT client the lookup runs on (bootstrap nodes, `Testnet` in tests).
n0-mainline = "0.7"
# Verified-streaming types for fetching a blob straight into a file
# (`iroh_blobs::get::fsm` yields `bao_tree` content items). Same 0.17 line iroh-blobs uses.
bao-tree = "0.17"

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
tempfile = "3"
# Verify endpoint signatures the way the tdf-iroh-s3 server does (verify_strict).
ed25519-dalek = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
