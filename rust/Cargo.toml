[package]
name = "iroh-swift-ffi"
version = "0.6.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Minimal FFI bindings for Iroh blob operations"

[lib]
crate-type = ["staticlib"]
name = "iroh_swift"

[dependencies]
# Same wire lines as the backend: https://github.com/arkavo-org/tdf-iroh-s3 (iroh 1.x, iroh-blobs 0.103).
# Minimums: iroh-blobs 0.103.0 is yanked; 0.103.1 applies each EventMask field to its
# own request type (iroh-blobs#270), so `push` is no longer governed by `get`.
iroh = "1.3.0"
iroh-blobs = { version = "0.103.1", features = ["fs-store"] }
# Docs support (optional, enabled via config)
iroh-docs = "0.101"
iroh-gossip = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
tokio-util = "0.7"
anyhow = "1"
futures-lite = "2"
hex = "0.4"
rand = "0.10"
# BLAKE3 for `iroh_blake3_hex` (same crate iroh-blobs hashes with).
blake3 = "1.8"
# Verified-streaming types for fetching a blob straight into a file
# (`iroh_blobs::get::fsm` yields `bao_tree` content items). Same 0.16 line iroh-blobs uses.
bao-tree = "0.16"

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
tempfile = "3"
# Verify endpoint signatures the way the tdf-iroh-s3 server does (verify_strict).
ed25519-dalek = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
