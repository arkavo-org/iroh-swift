[package]
name = "iroh-swift-ffi"
version = "0.5.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Minimal FFI bindings for Iroh blob operations"

[lib]
crate-type = ["staticlib"]
name = "iroh_swift"

[dependencies]
# Match the backend wire: https://github.com/arkavo-org/tdf-iroh-s3 (iroh = "1.0.3", iroh-blobs = "0.103")
# Caret requirement, same as the backend; its Cargo.lock resolves to iroh 1.1.0.
iroh = "1.0.3"
iroh-blobs = { version = "0.103", features = ["fs-store"] }
# Docs support (optional, enabled via config)
iroh-docs = "0.101"
iroh-gossip = "0.101"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
tokio-util = "0.7"
anyhow = "1"
futures-lite = "2"
hex = "0.4"
rand = "0.10"
# BLAKE3 for `iroh_blake3_hex` (same crate iroh-blobs hashes with).
blake3 = "1.8"
# Verified-streaming types for fetching a blob straight into a file
# (`iroh_blobs::get::fsm` yields `bao_tree` content items). Same 0.16 line iroh-blobs uses.
bao-tree = "0.16"

[build-dependencies]
cbindgen = "0.28"

[dev-dependencies]
tempfile = "3"
# Verify endpoint signatures the way the tdf-iroh-s3 server does (verify_strict).
ed25519-dalek = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
